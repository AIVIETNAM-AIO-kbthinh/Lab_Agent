[project]
name = "labagent"
version = "0.1.0"
description = "AI agent cho phòng lab: hỏi đáp KB, tự động hoá giấy tờ, job định kỳ trên Google Workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web / API
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
    # Config / validation
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Database (Postgres ở mọi môi trường; psycopg3 hỗ trợ cả sync lẫn async)
    "sqlalchemy[asyncio]>=2.1,<3",
    "psycopg[binary,pool]>=3.3,<4",
    "alembic>=1.14",
    # Google Workspace
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    # LLM (Claude, gọi API native /v1/messages) + embedding/rerank (endpoint OpenAI-compatible)
    "anthropic>=1.15,<2",
    "openai>=3.31,<4",
    "httpx>=0.28",
    # RAG
    "qdrant-client>=1.19,<2",
    "trafilatura>=2.3,<3",
    "tiktoken>=0.8",
    # Đọc / render tài liệu
    "python-docx>=1.1",
    "docxtpl>=0.20,<1",
    "pdfplumber>=0.11",
    "filetype>=1.2",
    "openpyxl>=3.1",  # xuất file Excel theo yêu cầu
    # Nghiệp vụ
    "rapidfuzz>=3.10",
    "apscheduler>=3.11,<4",
    "tenacity>=9.0",
    # Bảo mật
    "argon2-cffi>=23.1",
    # Quan sát hệ thống
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "sentry-sdk[fastapi]>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "time-machine>=2.16",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
]

[project.scripts]
labagent = "app.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.md"]  # không định dạng khối code trong tài liệu

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH", "DTZ"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # cho phép ký tự tiếng Việt trong chuỗi/comment
    "S101",     # assert cho bất biến nội bộ
    "B008",     # FastAPI Depends()/File() trong tham số mặc định
    "UP047",    # TypeVar cổ điển vẫn rõ ràng
    "SIM105",   # try/except/pass đọc rõ hơn contextlib.suppress trong vòng lặp async
    "ASYNC240", # thao tác file nhỏ (upload, snapshot) chấp nhận chạy đồng bộ
    "E501",     # ruff format quản lý độ dài code; chuỗi/docstring tiếng Việt dài được phép
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "E501"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "live: chạy với Google Drive/LLM thật, cần secrets (bỏ qua mặc định)",
    "db: cần Postgres (testcontainers)",
]
addopts = "-m 'not live' --strict-markers"
