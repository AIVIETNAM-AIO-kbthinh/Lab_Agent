# Bộ eval RAG cho KB (website lab + tài liệu Drive). Chạy: `labagent eval rag` (xem tests/eval/run_rag_eval.py).
# Câu hỏi soạn từ nội dung đã crawl/index ngày 2026-10-19 (78 trang isilab.click vi+en, Nội quy ISILAB trên Drive).
# Website hoặc nội quy đổi thì cập nhật lại key_points.
#
# Trường:
#   cat         nhóm câu hỏi (để thống kê theo nhóm)
#   role        guest | member (vai trò hỏi; retriever lọc quyền theo role)
#   kind        answer (mặc định) = phải trả lời đúng
#               refuse            = KB không có thông tin: phải nói là không có, không bịa
#               no_leak           = khách hỏi nội dung nội bộ: không được lộ (cả trong chunk truy xuất lẫn câu trả lời)
#   sources     chuỗi con của `location` (URL hoặc đường dẫn Drive) chứa đáp án; khớp một cái là đạt (retrieval)
#   key_points  mỗi phần tử là một nhóm phương án; phải có ít nhất 1 phương án của MỖI nhóm
#               (so khớp không dấu, không phân biệt hoa thường, bỏ ký tự markdown)
#   leak        (no_leak) các chuỗi nội bộ không được xuất hiện
#   must_not    regex không được xuất hiện trong câu trả lời

