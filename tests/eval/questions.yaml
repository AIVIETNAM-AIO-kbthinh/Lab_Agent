  key_points: [["dremel", "3d45"]]
- id: web07
  role: guest
  q: "Tin tức mới nhất của lab là gì?"
  expect_tools: [search_kb]
  key_points: [["bell system"]]
- id: web08
  role: guest
  q: "Workshop về IoT và Tự động hóa được tổ chức vào ngày nào?"
  expect_tools: [search_kb]
  key_points: [["23"], ["/7", "/07", "thang 7", "july"]]
- id: web09
  role: guest
  q: "What is the lab's TinyML project about?"
  expect_tools: [search_kb]
  key_points: [["tinyml"], ["uav"]]
- id: web10
  role: guest
  q: "Lab đã công bố bài trên những tạp chí nào?"
  expect_tools: [search_kb]
  key_points: [["ieee"]]

- id: tk01
  role: guest
  q: "Mình muốn tham gia lab thì phải làm gì?"
  expect_tools: [list_forms, search_kb]
  check: tool_only
- id: tk02
  role: guest
  q: "Đơn xin gia nhập của mình đã được duyệt chưa?"
