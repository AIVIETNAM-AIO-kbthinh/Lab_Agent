# Bộ eval P2: 30 câu (20 theo tài liệu thiết kế + 10 về nội dung website lab).
# Mỗi câu: role, câu hỏi, tool mong đợi, ý chính phải có (so khớp không dấu, không phân biệt hoa thường).
#   expect_tools: danh sách tool HỢP LỆ; câu trả lời đạt nếu đã gọi ít nhất một tool trong đó
#                 ([] = không được gọi tool nào ngoài danh sách `allow_tools`)
#   must_call_all: true = phải gọi đủ mọi tool trong expect_tools
#   expect_args: tham số bắt buộc của tool (so khớp nguyên giá trị)
#   key_points: mỗi phần tử là một nhóm phương án; câu trả lời phải chứa ít nhất một phương án của MỖI nhóm
#   must_not: regex không được xuất hiện trong câu trả lời (rò dữ liệu, tự xưng quyền)
#   check: tool_only = dữ liệu sheet thay đổi theo thời gian, chỉ chấm việc chọn tool + có câu trả lời
# Ý chính của câu web lấy từ http://isilab.click (khảo sát 2026-10-16); web đổi thì cập nhật lại.

- id: web01
  role: guest
  q: "ISI Lab nghiên cứu những hướng nào?"
  expect_tools: [search_kb]
  key_points: [["slam"], ["uav", "drone"], ["robot"]]
- id: web02
  role: guest
  q: "Trưởng lab là ai?"
  expect_tools: [search_kb]
  key_points: [["khoa"]]
- id: web03
  role: guest
  q: "Lab ở đâu, mình muốn đến trực tiếp?"
  expect_tools: [search_kb]
  key_points: [["phan tay nhac"]]
- id: web04
  role: guest
  q: "Giờ làm việc của lab thế nào?"
  expect_tools: [search_kb]
  key_points: [["8:00", "8h", "8 gio"], ["17:00", "17h", "17 gio", "5 gio chieu"]]
- id: web05
  role: guest
  q: "Dự án ITS của lab là gì, hợp tác với đơn vị nào?"
  expect_tools: [search_kb]
  key_points: [["mimos"]]
- id: web06
  role: guest
